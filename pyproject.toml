[project]
name = "proswin"
version = "0.1.0"
description = "Probabilistic solar wind speed prediction using machine learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Collin", email = "collin@gfz.de" }
]
keywords = ["solar wind", "space weather", "machine learning", "forecasting", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.12"

dependencies = [
    "numpy==2.2.3",
    "scipy==1.15.1",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "scikit-image==0.25.2",
    "matplotlib==3.10.0",
    "wandb==0.19.11",
    "optuna==4.4.0",
    "scoringrules==0.8.0",
    "tqdm==4.67.1",
    "timm==1.0.14",
    # CUDA runtime libraries
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cuda-cupti-cu12==12.6.80",
    "nvidia-cuda-nvrtc-cu12==12.6.77",
    "nvidia-cuda-runtime-cu12==12.6.77",
    "nvidia-cudnn-cu12==9.5.1.17",
    "nvidia-cufft-cu12==11.3.0.4",
    "nvidia-curand-cu12==10.3.7.77",
    "nvidia-cusolver-cu12==11.7.1.2",
    "nvidia-cusparse-cu12==12.5.4.2",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.6.85",
    "nvidia-nvtx-cu12==12.6.77",
    "nvidia-cusparselt-cu12==0.6.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.10",
    "pytest>=8.0",
    "ipykernel==6.29.5",
    "ipython==8.32.0",
    "nbformat==5.10.4",
]

[project.urls]
Homepage = "https://github.com/danielcollin96/proswin"
Paper = "https://doi.org/insert_later"
Dataset = "https://doi.org/10.5880/GFZ.OJSJ.2026.001"

# ── Build system ──────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "ruff==0.14.10",
    "pytest>=8.0",
    "ipykernel==6.29.5",
    "ipython==8.32.0",
]

# PyTorch CUDA 12.6 index — provides the +cu126 builds
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

# ── Ruff (linting + formatting) ───────────────────────────────────────────────

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort

[tool.ruff.format]
quote-style = "double"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
